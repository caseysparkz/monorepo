# Author:       Casey Sparks
# Date:         March 19, 2025
# Description:  Run Terraform operations to:
#                 1. Enumerate directories with changed Terraform files.
#                 1. Run tests against changed Terraform modules.
#                 1. Validate the syntax of changed Terraform manifests.
#                 1. Check the security posture of the changed Terraform
#                     modules and manifests.
#                 1. Generate a cost estimate of planned infrastructure changes
#                     and post the estimate to the pull request.
#                 1. Depending on if the event is a pull request or merge:
#                   a. On pull request: Plan infrastructure changes and comment
#                       the plan to the pull request.
#                   a. On merge: Deploy infrastructure changes.
---
name: "terraform"
on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - "!infra/**/README.md"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - "!infra/**/README.md"
env:
  AWS_DEFAULT_REGION: "us-west-2"
  INFRACOST_CONFIG: "infracost.yml"
  TF_PLANFILE: "/tmp/out.tfplan"
  TF_VERSION: "1.16.6" # Increment to update Terraform
jobs:
  changed_terraform:
    name: "git diff"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      all_dirs: "${{ steps.all_changed.outputs.tf_all_changed_dirs }}"
      manifest_dirs: "${{ steps.changed_manifests.outputs.tfmanifest_all_changed_files }}"
      infracost_updated: "${{ steps.changed_manifests.outputs.infracost_any_changed }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "Get changed Terraform manifests"
        id: "changed_manifests"
        uses: "tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96" # 47.0.6
        with:
          files_yaml_from_source_file: ".github/config/changed_files.yml"
          matrix: true
          dir_names: true

      - name: "Get changed Terraform modules"
        id: "changed_modules"
        uses: "tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96" # 47.0.6
        with:
          files_yaml_from_source_file: ".github/config/changed_files.yml"
          matrix: true
          dir_names: true
          dir_names_max_depth: 3 # evaluates to ["infra/modules/x","infra/modules/y","infra/modules/z"]

      - name: "Get all changed Terraform directories"
        id: "all_changed"
        env:
          MANIFEST_DIRS: "${{ steps.changed_manifests.outputs.tfmanifest_all_changed_files }}"
          MODULE_DIRS: "${{ steps.changed_modules.outputs.tfmodule_all_changed_files }}"
        run: |
          ALL_DIRS="$(                                                                          \
            printf '%s\n' "${MANIFEST_DIRS}" "${MODULE_DIRS}"                                   \
            | jq -s '.[0] + .[1]'                                                               \
            | jq -r tostring                                                                    \
          )"

          printf 'tf_all_changed_dirs=%s\n' "${ALL_DIRS}" >> "${GITHUB_OUTPUT}"

      - name: "Debug outputs"
        env:
          MANIFEST_DIRS: "${{ steps.changed_manifests.outputs.tfmanifest_all_changed_files }}"
          MODULE_DIRS: "${{ steps.changed_modules.outputs.tfmodule_all_changed_files }}"
          ALL_DIRS: "${{ steps.all_changed.outputs.tf_all_changed_dirs }}"
          INFRACOST_UPDATED: "${{ steps.changed_manifests.outputs.infracost_any_changed }}"
        run: |
          printf 'all_dirs: %s\n' "${ALL_DIRS}"
          printf 'manifest_dirs: %s\n' "${MANIFEST_DIRS}"
          printf 'infracost_updated: %s\n' "${INFRACOST_UPDATED}"

  terraform_test:
    name: "terraform test"
    runs-on: "ubuntu-latest"
    if: "${{ github.event_name == 'pull_request' && needs.changed_terraform.outputs.all_dirs != '[]' }}"
    needs: ["changed_terraform"]
    concurrency:
      group: "${{ github.workflow }}-terraformtest-${{ matrix.dir }}"
      cancel-in-progress: false
    permissions:
      contents: "read"
    strategy:
      max-parallel: 4
      matrix:
        dir: "${{ fromJSON(needs.changed_terraform.outputs.all_dirs) }}"
    defaults:
      run:
        working-directory: "${{ matrix.dir }}"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "apt install -y terraform"
        uses: "hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e" # v4.0.1
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: "terraform init"
        run: "terraform init --upgrade --backend=false" # Don't need backend for linting

      - name: "terraform test"
        run: "terraform test"

  terraform_validate:
    name: "terraform validate"
    runs-on: "ubuntu-latest"
    if: "${{ needs.changed_terraform.outputs.all_dirs != '[]' }}"
    needs: ["changed_terraform"]
    permissions:
      contents: "read"
    strategy:
      max-parallel: 4
      matrix:
        dir: "${{ fromJSON(needs.changed_terraform.outputs.all_dirs) }}"
    defaults:
      run:
        working-directory: "${{ matrix.dir }}"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "apt install -y terraform"
        uses: "hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e" # v4.0.1
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: "terraform init"
        run: "terraform init --upgrade --backend=false" # Don't need backend for linting

      - name: "terraform validate"
        run: "terraform validate"

  trivy:
    name: "trivy"
    runs-on: "ubuntu-latest"
    if: "${{ github.event_name == 'pull_request' }}"
    needs:
      - "changed_terraform"
      - "terraform_validate"
    permissions:
      contents: "read"
    strategy:
      max-parallel: 4
      matrix:
        dir: "${{ fromJSON(needs.changed_terraform.outputs.all_dirs) }}"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "trivy config ${{ matrix.dir }}"
        uses: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25" # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "${{ matrix.dir }}"
          exit-code: "1"

  infracost_diff:
    name: "infracost diff"
    runs-on: "ubuntu-latest"
    if: "${{ github.event_name == 'pull_request' && needs.changed_terraform.outputs.manifest_dirs != '[]' }}"
    needs:
      - "changed_terraform"
      - "terraform_validate"
    permissions:
      contents: "read"
      pull-requests: "write"
    env:
      COMMENT: "!!!WARNING!!! Terraform manifests updated, but Infracost files remain untouched."
    steps:
      - name: "gh pr view --comments"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'false' }}"
        uses: "peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad" # v4.0.0
        id: "find_comment"
        with:
          issue-number: "${{ github.event.pull_request.number || github.event.issue.number }}"
          comment-author: "github-actions[bot]"
          body-includes: "${{ env.COMMENT }}"

      - name: "gh pr comment"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'false' }}"
        uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" #v9.0.0
        with:
          script: |
            const comment_id = '${{ steps.find_comment.outputs.comment-id }}';
            const body = '${{ env.COMMENT }}';

            if (comment_id) {
              // Update the existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment_id,
                body: body
              });
            } else {
              // Create a new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: "git checkout main"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.base.ref }}"

      - name: "apt install -y infracost"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        uses: "infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a"  # v5.0.1
        with:
          api-key: "${{ secrets.INFRACOST_API_KEY }}"
          github-token: "${{ github.token }}"

      - name: "infracost breakdown (baseline)"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        run: >
          infracost breakdown                                                 \
            --config-file ${{ env.INFRACOST_CONFIG }}                         \
            --format json                                                     \
            --out-file /tmp/infracost_base.json

      - name: "git checkout HEAD"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0

      - name: "infracost diff"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        run: >
          infracost diff                                                      \
            --config-file ${{ env.INFRACOST_CONFIG }}                         \
            --format json                                                     \
            --compare-to /tmp/infracost_base.json                             \
            --out-file /tmp/infracost_diff.json

      - name: "infracost comment"
        if: "${{ needs.changed_terraform.outputs.infracost_updated == 'true' }}"
        run: >
          infracost comment github                                            \
            --path /tmp/infracost_diff.json                                   \
            --repo ${{ github.repository }}                                   \
            --pull-request ${{ github.event.pull_request.number }}            \
            --github-token ${{ github.token }}                                \
            --behavior update

  terraform_plan:
    name: "terraform plan"
    runs-on: "ubuntu-latest"
    # Planfiles handed to terraform_apply via artifacts.
    if: "${{ github.event_name == 'pull_request' && needs.changed_terraform.outputs.manifest_dirs != '[]' }}"
    concurrency:
      group: "${{ github.workflow }}-terraformplan-${{ matrix.dir }}"
      cancel-in-progress: false
    needs:
      - "changed_terraform"
      - "terraform_validate"
    permissions:
      actions: "write" # Delete stale planfile artifacts
      contents: "read"
      id-token: "write"
      pull-requests: "write"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dir: "${{ fromJSON(needs.changed_terraform.outputs.manifest_dirs) }}"
    defaults:
      run:
        working-directory: "${{ matrix.dir }}"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "apt install -y terraform"
        uses: "hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e" # v4.0.1
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: "aws sso login"
        uses: "aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd"  # v6.3.0
        with:
          aws-region: "${{ env.AWS_DEFAULT_REGION }}"
          role-session-name: "gha-${{ github.run_id }}"
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_READONLY }}"

      - name: "terraform init"
        run: "terraform init"

      - name: "terraform plan"
        run: "terraform plan -no-color -out=${TF_PLANFILE}"

      - name: "Delete stale planfiles"
        # Keep only the latest planfile per PR + directory: drop artifacts from
        # earlier runs. A planfile is always uploaded (even with no changes), so
        # terraform_apply can treat a missing planfile as an error.
        id: "artifact"
        env:
          DIR: "${{ matrix.dir }}"
          GH_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: |
          NAME="tfplan-pr${PR_NUMBER}-$(printf '%s' "${DIR}" | tr '/' '_')"

          printf 'name=%s\n' "${NAME}" >> "${GITHUB_OUTPUT}"

          gh api                                                              \
            --paginate "repos/${REPO}/actions/artifacts?name=${NAME}"         \
            --jq ".artifacts[] | select(.workflow_run.id != ${RUN_ID}) | .id" \
          | while read -r ID; do
            gh api --method DELETE "repos/${REPO}/actions/artifacts/${ID}"
          done

      - name: "Upload planfile"
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "${{ steps.artifact.outputs.name }}"
          path: "${{ env.TF_PLANFILE }}"
          if-no-files-found: "error"
          overwrite: true
          retention-days: 8

      - name: "gh pr comment"
        uses: "borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542"  # v3.2.0
        with:
          token: "${{ github.token }}"
          planfile: "${{ env.TF_PLANFILE }}"
          terraform-cmd: "terraform"
          working-directory: "${{ matrix.dir }}"
          header: "Terraform Plan"
          skip-comment: false
          skip-empty: false
          expand-comment: false

  terraform_apply:
    name: "terraform apply"
    runs-on: "ubuntu-latest"
    # Runs on push only, applying the planfile from the merged PR.
    if: "${{ github.event_name == 'push' && needs.changed_terraform.outputs.manifest_dirs != '[]' }}"
    concurrency:
      group: "${{ github.workflow }}-terraformapply-${{ matrix.dir }}"
      cancel-in-progress: false
    needs:
      - "changed_terraform"
      - "terraform_validate"
    permissions:
      actions: "read" # Download planfile artifacts from the PR run
      contents: "read"
      id-token: "write"
      pull-requests: "read"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dir: "${{ fromJSON(needs.changed_terraform.outputs.manifest_dirs) }}"
    defaults:
      run:
        working-directory: "${{ matrix.dir }}"
    steps:
      # Fails when no planfile from the merged PR's final commit exists (e.g.
      # direct push to main, expired artifact, or failed plan), rather than
      # silently skipping the apply.
      - name: "Find planfile"
        id: "planfile"
        working-directory: "${{ github.workspace }}"
        env:
          DIR: "${{ matrix.dir }}"
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          SHA: "${{ github.sha }}"
        run: |
          PR="$(                                                                \
            gh api "repos/${REPO}/commits/${SHA}/pulls"                         \
              --jq '[.[] | select(.merged_at != null)][0] // empty
            | "\(.number) \(.head.sha)"'                                        \
          )"

          if [ -z "${PR}" ]; then
            printf '::error::No merged PR for %s; cannot apply %s without a reviewed plan.\n' "${SHA}" "${DIR}"
            exit 1
          fi

          read -r PR_NUMBER PR_HEAD_SHA <<< "${PR}"

          NAME="tfplan-pr${PR_NUMBER}-$(printf '%s' "${DIR}" | tr '/' '_')"
          RUN_IDS="$(                                                           \
            gh api --paginate "repos/${REPO}/actions/artifacts?name=${NAME}"    \
              --jq ".artifacts[]
                  | select(.expired == false and .workflow_run.head_sha == \"${PR_HEAD_SHA}\")
                  | .workflow_run.id"                                         \
          )"
          RUN_ID="${RUN_IDS%%$'\n'*}"  # Newest first

          if [ -z "${RUN_ID}" ]; then
            printf '::error::No planfile for %s at %s (PR #%s). ' "${DIR}" "${PR_HEAD_SHA}" "${PR_NUMBER}"
            printf 'It may have expired; re-run the PR terraform plan, then re-run this job.\n'
            exit 1
          fi

          printf 'name=%s\n' "${NAME}" >> "${GITHUB_OUTPUT}"
          printf 'run_id=%s\n' "${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: "Download planfile"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "${{ steps.planfile.outputs.name }}"
          run-id: "${{ steps.planfile.outputs.run_id }}"
          github-token: "${{ github.token }}"
          path: "/tmp"

      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "apt install -y terraform"
        uses: "hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e" # v4.0.1
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: "aws sso login"
        uses: "aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd"  # v6.3.0
        with:
          aws-region: "${{ env.AWS_DEFAULT_REGION }}"
          role-session-name: "gha-${{ github.run_id }}"
          role-to-assume: "${{ secrets.AWS_ROLE_ARN_ADMIN }}"

      - name: "terraform init"
        run: "terraform init"

      - name: "terraform apply"
        run: "terraform apply --auto-approve ${TF_PLANFILE}"
