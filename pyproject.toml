[project]
name = "cs-monorepo"
description = "Global installer for the monorepo."
version = "0.1.0"
requires-python = ">=3.13"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "CaseySparkz", email = "contact@caseysparkz.com" }]
dependencies = [
    "cs-ansible",

    "boto3==1.44.0",
]

[dependency-groups]
test = [
    "cs-ansible[test]",

    "boto3-stubs==1.44.0",
    "botocore-stubs==1.43.126",
    "ipdb==0.13.13",
    "moto==5.2.5",
    "mypy==2.4.1",
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "types-boto3[ses]",
    "uv-audit==0.1.9",
    "yamllint==1.38.0",
]
dev = [
    { include-group = "test" },

    "ipython==9.18.1",
    "yq==4.4.5",
]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.sources]
cs-ansible = { workspace = true }

[tool.uv.workspace]
members = ["ansible"]

# Tools ========================================================================
# Misc. -----------------------------------------------------------------------
[tool.ipdb]
context = 20
